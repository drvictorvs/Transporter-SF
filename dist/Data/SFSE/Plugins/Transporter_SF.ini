; Settings for Transporter_SF. The Papyrus side reads them each time a command runs, so most edits
; apply without restarting; [TravelHook] is read once, when the game starts.
; Form settings take a hex form ID without 0x (e.g. 0001ABCD) or an EditorID; leave empty for none.
;
; With OSF Settings installed, [Transporter] is set in game instead (Pause > MOD SETTINGS,
; or F10 > Transporter) and this section is only a fallback. Same key names.

[Transporter]
; Transporter menu (hotkey set in OSF Settings, default F7; console: TransporterMenu)
;   eShipRule: when the ship row can be used: landed (in this area), samePlanet, anywhere
eShipRule=samePlanet
bDiscoveredOnly=1
; Search radius in meters (0 = the whole area), and how many locations to list (1-100)
fPoiRadius=0
; With fPoiRadius=0, also list markers in the planet's other areas (cities, landing sites)
bWholePlanet=1
iPoiMax=40
bBlockInCombat=1

; Followers within this distance (game units) travel with you, and how far apart they arrive
fPassengerRadius=1024
fPassengerSpacing=96

; Countdown before energizing, in seconds (0 = none). eCountdownStyle: gravJump (the grav-jump
; countdown box; needs Transporter_SF.dll) or notifications, which use
; sCountdownText: "Transporter lock in 3", "2", "1"
iCountdownSeconds=3
eCountdownStyle=gravJump
sCountdownText=Transporter lock in

; Activation gesture, played after the countdown; the sequence then waits fGestureSeconds.
;   sPlayerIdle / sFollowerIdle: a vanilla Idle form (e.g. the Chronomark watch check; see README)
;   or a custom animation file through an animation framework's global function:
;     sAnimScript.sAnimPlayFunction(Actor, String file), and sAnimStopFunction(Actor) for
;     frameworks whose animations loop until stopped. Example for NAF:
;       sAnimScript=NAF
;       sAnimPlayFunction=PlayAnimation
;       sPlayerAnimFile=Transporter\WatchActivate.glb
sPlayerIdle=
sFollowerIdle=
sAnimScript=
sAnimPlayFunction=PlayAnimation
sAnimStopFunction=
sPlayerAnimFile=
sFollowerAnimFile=
fGestureSeconds=2.0

; Beam out, on you and each passenger:
;   sOutLight  = a Light (LIGH) placed fLightHeight above each traveller until the move
;   sOutShader = an EffectShader (EFSH), shown for fOutShaderSeconds
;   sOutSpell  = a Spell cast on the traveller
;   sOutSound  = a WwiseEvent (WWED)
;   sOutImod   = an ImageSpaceModifier (IMOD), the screen effect, applied once
sOutLight=
fLightHeight=64
sOutShader=
fOutShaderSeconds=2.0
sOutSpell=
sOutSound=
sOutImod=
fDelayBeforeMove=2.5

; Fade to black during the move (1 = yes, 0 = no), the fade time, and the pause after arriving
bFade=1
fFadeSeconds=0.5
fDelayAfterMove=1.0

; Beam in, after the move; sInLight stays for fInLightSeconds
sInLight=
fInLightSeconds=2.0
sInShader=
fInShaderSeconds=2.0
sInSpell=
sInSound=
sInImod=

; Advanced: the base form used to find nearby map markers, game units per meter (for the
; menu's distances and fPoiRadius), and how far behind the pilot seat "Teleport ship" lands you
sMapMarkerBase=MapMarker
fUnitsPerMeter=70
fShipSeatOffset=96

[TravelHook]
; 0 = off. 1 = probe: log every call of the game's fast-travel confirm callbacks to
; Documents\My Games\Starfield\SFSE\Logs\Transporter_SF.log, then let fast travel run as normal.
iMode=0
; Which vtable slot to probe; slot 0 is normally the destructor
iVfuncIndex=1
